# Plan § 3/§ 4: deploy one rig page to GitHub Pages. Nothing is committed (ADR 0003);
# rerun with an empty marker to upload the clean copy over the same link.
name: preview
on:
  workflow_dispatch:
    inputs:
      marker:
        description: LANE_MARKER for the banner (empty = "no marker set")
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install
      - run: scripts/preview.sh /digest/2026-10-28 _site/index.html
        env:
          LANE_MARKER: ${{ inputs.marker }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
